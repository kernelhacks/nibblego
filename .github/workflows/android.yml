# Compila el APK de la app Android cada vez que cambia la carpeta android/
# (o a mano desde la pestaña Actions → "App Android" → Run workflow).
name: App Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Servidor al que se conecta la app"
        default: "https://soporte.nibbletec.com"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64. El APK se firma con una llave de pruebas que cambia en cada compilación: sirve para probar, no para clientes."
          fi

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVER_URL: ${{ inputs.server_url || vars.ASSIST_SERVER_URL || 'https://soporte.nibbletec.com' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PserverUrl="$SERVER_URL" \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/nibbletec-assist.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nibbletec-assist-apk
          path: ${{ runner.temp }}/nibbletec-assist.apk
