# Funciona igual en Coolify (variables desde su interfaz) y en local (archivo .env).
services:
  assist:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?}
      BRAND_NAME: ${BRAND_NAME:-Nibbletec}
      TECH_USERS: ${TECH_USERS:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      LINK_TTL_MIN: ${LINK_TTL_MIN:-60}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-8}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:?}
      TURN_SECRET: ${TURN_SECRET:?}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # Navegador compartido. Vacío = desactivado.
      COBROWSE_URL: ${COBROWSE_URL-http://browser:9223}
      COBROWSE_MAX: ${COBROWSE_MAX:-3}
      COBROWSE_IDLE_MIN: ${COBROWSE_IDLE_MIN:-15}
      DATA_DIR: /data
    volumes:
      - assist-data:/data   # registro de aceptaciones (audit.jsonl)
    expose:
      - "8080"
    networks:
      - default
      - cobrowse
    # En Coolify: asigna el dominio https://soporte.nibbletec.com:8080 a este servicio.
    # Con un Traefik propio (sin Coolify), descomenta y ajusta:
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.assist.rule=Host(`soporte.nibbletec.com`)
    #   - traefik.http.routers.assist.entrypoints=https
    #   - traefik.http.routers.assist.tls.certresolver=letsencrypt
    #   - traefik.http.services.assist.loadbalancer.server.port=8080

  # Chromium del navegador compartido. Sin secretos y en una red interna sin salida:
  # solo puede navegar a través del proxy filtrado de `assist`.
  browser:
    build: ./browser
    restart: unless-stopped
    networks:
      - cobrowse
    environment:
      PROXY: http://assist:3128
    shm_size: 512m
    mem_limit: 2g
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Servidor TURN: retransmite el video cuando el cliente está detrás de una red estricta.
  coturn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?}
      - --realm=${TURN_REALM:?}
      - --external-ip=${TURN_EXTERNAL_IP:?}
      - --stale-nonce=600
      - --user-quota=12
      - --total-quota=1200
      - --no-multicast-peers
      - --log-file=stdout
      - --simple-log
      # 4.18: la CLI viene apagada y TLS 1.0/1.1 desactivados por defecto
      # Impide usar el TURN para alcanzar redes internas del servidor
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255

networks:
  cobrowse:
    internal: true

volumes:
  assist-data:
